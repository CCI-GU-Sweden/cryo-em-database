# Human-maintained dependencies for the local prototype.
# Keep Python and Django on the agreed release series while allowing patch fixes.
name: cci-cryo-em
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - django=5.2
  # psycopg is the Python driver; postgresql supplies the local database tools.
  # Installing PostgreSQL does not automatically start a database server.
  - psycopg>=3.2,<4
  - postgresql=17
  - python-dotenv>=1,<2
  - ruff>=0.14,<1
  # Read the private Excel example to seed preparation suggestions (not grid records).
  - openpyxl>=3.1,<4
