<div class="property-filter">
  {{ filter.non_field_errors }}
  <div>{{ filter.property.as_field_group }}</div>
  <div data-filter-kind="text">{{ filter.contains.as_field_group }}</div>
  <div data-filter-kind="number">{{ filter.minimum.as_field_group }}{{ filter.maximum.as_field_group }}</div>
  <div data-filter-kind="date">{{ filter.from_date.as_field_group }}{{ filter.to_date.as_field_group }}</div>
  <div data-filter-kind="boolean">{{ filter.boolean_value.as_field_group }}</div>
  <button type="button" data-remove-filter>Remove filter</button>
</div>
