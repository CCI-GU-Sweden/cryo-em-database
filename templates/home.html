{% extends "base.html" %}
{% block content %}
<h1>Welcome, {{ user.get_short_name|default:user.username }}</h1>
<p>The local prototype is running. Preparation sessions and grid registration are the next step.</p>
{% if user.is_staff %}<p><a href="{% url 'admin:index' %}">Account administration</a></p>{% endif %}
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">Sign out</button>
</form>
{% endblock %}
