<div class="property-filter">
{{ filter.non_field_errors }}
<div>{{ filter.property.as_field_group }}</div>
<div data-storage-kind="puck">{{ filter.puck.as_field_group }}</div>
<div data-storage-kind="box">{{ filter.box.as_field_group }}</div>
<div data-storage-kind="box_type">{{ filter.box_type.as_field_group }}</div>
<div data-storage-kind="slot">{{ filter.slot.as_field_group }}</div>
<div data-storage-kind="clipped">{{ filter.clipped.as_field_group }}</div>
<button type="button" data-remove-filter>Remove filter</button>
</div>
